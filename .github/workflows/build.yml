name: Build rankings

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Completed week override (optional)"
        required: false
  schedule:
    - cron: "30 14 * 9-12 2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Generate site (latest completed week)
        if: ${{ !inputs.week }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python -m sleeper_rankings.cli
      - name: Generate site (week override)
        if: ${{ inputs.week }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python -m sleeper_rankings.cli --week "${{ inputs.week }}"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy to Netlify
        if: ${{ env.HAS_NETLIFY == 'true' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=dist
