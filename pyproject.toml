[project]
name = "sypip-site"
version = "0.1.0"
description = "Generate a public weekly Sleeper fantasy-football power rankings site."
requires-python = ">=3.11"
dependencies = ["fantasy-football-reports @ git+https://github.com/geerc/fantasy-football-reports.git@master"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sleeper-rankings = "sleeper_rankings.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
